<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System - Course Catalog</title>
  <script src="assets/js/config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page">
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html">Student Management System</a>
      <nav class="nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="registration.html">Registration</a>
        <a href="results.html">Results</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Course Catalog</h1>
        <p>Add and review courses stored through the backend API.</p>
      </div>
      <a class="btn btn-outline" href="dashboard.html">Back to Dashboard</a>
    </section>

    <div class="subnav" role="tablist" aria-label="Course catalog">
      <button class="btn btn-outline active" type="button" data-section-tab="add-course">Add Course</button>
      <button class="btn btn-outline" type="button" data-section-tab="course-list">Course List</button>
      <button class="btn btn-outline" type="button" data-section-tab="data-tools">Data Tools</button>
    </div>

    <section class="card tab-section active" data-section-panel="add-course">
      <h2>Add Course</h2>
      <form id="courseForm">
        <div class="form-grid">
          <label>
            <span>Department</span>
            <select name="department" class="department-select" required>
              <option value="">Select department</option>
            </select>
          </label>
          <label>
            <span>Course Code</span>
            <input type="text" name="code" placeholder="CSC 205" required />
          </label>
          <label>
            <span>Course Title</span>
            <input type="text" name="title" placeholder="Database Systems" required />
          </label>
          <label>
            <span>Units</span>
            <input type="number" name="units" min="1" max="6" required />
          </label>
          <label>
            <span>Semester</span>
            <select name="semester" required>
              <option>First Semester</option>
              <option>Second Semester</option>
            </select>
          </label>
        </div>
        <div class="actions" style="margin-top: 16px;">
          <button class="btn" type="submit">Add Course</button>
        </div>
      </form>
    </section>

    <section class="card tab-section" data-section-panel="course-list">
      <h2>Current Courses</h2>
      <div class="mini-form" style="margin-top: 10px;">
        <select id="courseFilterDepartment">
          <option value="">All departments</option>
        </select>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Department</th>
            <th>Units</th>
            <th>Semester</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="coursesBody"></tbody>
      </table>
    </section>

    <section class="card tab-section" data-section-panel="data-tools">
      <h2>Data Tools</h2>
      <div class="actions">
        <button class="btn" id="exportDataBtn" type="button">Export JSON</button>
        <label class="btn btn-outline" for="importDataFile">Import JSON</label>
        <input id="importDataFile" type="file" accept="application/json" style="display: none;" />
        <button class="btn btn-outline" id="resetDataBtn" type="button">Reset Backend Data</button>
      </div>
    </section>
  </main>

  <script src="assets/js/api-store.js"></script>
  <script src="assets/js/manage-data.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
