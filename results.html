<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System - Results</title>
  <script src="assets/js/config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page">
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html">Student Management System</a>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="registration.html">Registration</a>
        <a href="results.html" class="active">Results</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Semester Results</h1>
        <p>View grades, GPA, and CGPA summary.</p>
      </div>
      <button class="btn btn-outline" type="button" onclick="window.print()">Download PDF</button>
    </section>

    <form id="reportEntryForm" data-role="admin">
      <section class="card">
        <h2>Input Student Report</h2>
        <div class="form-grid">
          <label>
            <span>Student No</span>
            <select name="studentNo" id="reportStudentNo" required>
              <option value="">Select student</option>
            </select>
          </label>
          <label>
            <span>Academic Year</span>
            <select name="academicYear" id="reportAcademicYear" required>
              <option>2025/2026</option>
              <option>2026/2027</option>
            </select>
          </label>
          <label>
            <span>Semester</span>
            <select name="semester" id="reportSemester" required>
              <option>First Semester</option>
              <option>Second Semester</option>
            </select>
          </label>
          <label>
            <span>Course Code</span>
            <select name="course" id="reportCourse" required>
              <option value="">Select registered course</option>
            </select>
          </label>
          <label>
            <span>Unit</span>
            <input
              type="number"
              name="unit"
              id="reportUnit"
              min="1"
              max="6"
              step="1"
              inputmode="numeric"
              placeholder="Auto-filled or enter 1–6"
              required
            />
          </label>
          <label>
            <span>CA Score</span>
            <input type="number" name="ca" id="reportCa" min="0" max="40" required />
          </label>
          <label>
            <span>Exam Score</span>
            <input type="number" name="exam" id="reportExam" min="0" max="70" required />
          </label>
          <label>
            <span>Total</span>
            <input type="number" name="total" id="reportTotal" min="0" max="100" placeholder="Auto = CA + Exam" readonly />
          </label>
          <label>
            <span>Grade (Optional)</span>
            <input type="text" name="grade" maxlength="1" placeholder="Auto" />
          </label>
        </div>
        <div class="actions" style="margin-top: 16px;">
          <button class="btn" type="submit">Save Report Row</button>
        </div>
      </section>
    </form>

    <form id="resultsForm">
      <section class="card">
        <div class="form-grid">
          <label id="resultsStudentField">
            <span>Student No</span>
            <select name="studentNo" id="resultsStudentNo" required>
              <option value="">Select student</option>
            </select>
          </label>
          <label>
            <span>Academic Year</span>
            <select name="academicYear" required>
              <option>2025/2026</option>
              <option>2026/2027</option>
            </select>
          </label>
          <label>
            <span>Semester</span>
            <select name="semester" required>
              <option>First Semester</option>
              <option>Second Semester</option>
            </select>
          </label>
          <label>
            <span>Sort By</span>
            <select name="sort">
              <option value="course_code">Course Code</option>
              <option value="course_unit">Course Unit</option>
              <option value="course_work">Course Work</option>
              <option value="exam">Exam</option>
              <option value="total">Total</option>
            </select>
          </label>
          <label>
            <span>Order</span>
            <select name="order">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </label>
        </div>
        <div class="actions" id="resultsSubmitActions" style="margin-top: 16px;">
          <button class="btn" id="resultsSubmitButton" type="submit">Fetch Results</button>
        </div>
      </section>
    </form>

    <section class="card">
      <h2>Result Breakdown</h2>
      <table class="table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Unit</th>
            <th>CA</th>
            <th>Exam</th>
            <th>Total</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="6">Loading results...</td>
          </tr>
        </tbody>
      </table>
      <div class="summary">
        <div>
          <h3>GPA</h3>
          <p id="gpaValue">—</p>
        </div>
        <div>
          <h3>CGPA</h3>
          <p id="cgpaValue">—</p>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/api-store.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
