<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System - Course Registration</title>
  <script src="assets/js/config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page">
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html">Student Management System</a>
      <nav class="nav" aria-label="Primary navigation"></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Course Registration</h1>
        <p>Select your courses for the current semester.</p>
      </div>
      <div class="pill" id="registrationDeadline">Deadline: Loading…</div>
    </section>

    <form id="registrationForm">
      <section class="card">
        <h2>Student Info</h2>
        <div class="form-grid">
          <label>
            <span>Department</span>
            <select name="department" id="registrationDepartment" required>
              <option value="">Select department</option>
            </select>
          </label>
          <label>
            <span>Student No</span>
            <select name="studentNo" id="registrationStudentNo" required>
              <option value="">Select student</option>
            </select>
          </label>
          <label>
            <span>Registration No</span>
            <input type="text" id="generatedRegNo" value="Generated after submission" readonly />
          </label>
          <label>
            <span>Semester</span>
            <select name="semester" required>
              <option>First Semester</option>
              <option>Second Semester</option>
            </select>
          </label>
          <label>
            <span>Academic Year</span>
            <select name="academicYear" required>
              <option>2025/2026</option>
              <option>2026/2027</option>
            </select>
          </label>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <h3>Available Courses</h3>
          <div class="checklist" id="courseChecklist">
            <p class="loading-inline">Loading available courses…</p>
          </div>
        </div>
        <div class="card">
          <h3>Selected Courses</h3>
          <ul class="list" id="selectedCourses">
            <li class="empty-state">No courses selected yet.</li>
          </ul>
          <button class="btn" type="submit">Submit Registration</button>
        </div>
      </section>
    </form>
  </main>

  <script src="assets/js/api-store.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
